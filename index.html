<style>
:root{--r:13px}
html[data-theme="dark"]{
  --bg:#110d1c; --surface:#181226; --card:#201833; --cardAlt:#2a2042;
  --border:#352a52; --borderL:#4a3d6e;
  --text:#f4eeff; --muted:#a99ec8; --dim:#857aa6;
  --accent:#ffd166; --onAccent:#221a34;
  --mint:#06d6a0; --gold:#fbbf24; --win:#5eead4; --loss:#fb7185;
  --accentInk:#ffe29a; --goldInk:#fcd34d; --lossInk:#fda4af; --mintInk:#5eead4;
  --glow1:rgba(6,214,160,.07); --glow2:rgba(255,209,102,.07);
}
html[data-theme="light"]{
  --bg:#f6f7fb; --surface:#eef1f7; --card:#ffffff; --cardAlt:#f1f4fa;
  --border:#dbe1ec; --borderL:#c3ccdc;
  --text:#111827; --muted:#414b58; --dim:#5b6372;
  --accent:#d98e04; --onAccent:#ffffff;
  --mint:#0a9c77; --gold:#b45309; --win:#047857; --loss:#be123c;
  --accentInk:#7c4a02; --goldInk:#7c4a02; --lossInk:#9f1239; --mintInk:#04674f;
  --glow1:rgba(10,156,119,.05); --glow2:rgba(217,142,4,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overscroll-behavior-y:contain}
body.reflock{overflow:hidden}
body{background:radial-gradient(1100px 550px at 85% -10%,var(--glow1),transparent 60%),radial-gradient(900px 500px at -10% 5%,var(--glow2),transparent 55%),var(--bg);
  color:var(--text);font-family:'Outfit',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;padding-bottom:74px;font-variant-numeric:tabular-nums}
.anton{font-family:'Anton','Arial Narrow',Impact,sans-serif;font-weight:400;letter-spacing:.01em}
.wrap{max-width:1120px;margin:0 auto;padding:16px 12px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
h1{font:400 25px 'Anton';margin:0;line-height:1.1;text-transform:uppercase;letter-spacing:.02em}
.sub{color:var(--muted);font-size:12.5px;margin-top:3px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 14px}
.pill{background:var(--card);border:1px solid var(--border);padding:5px 10px;border-radius:99px;font-size:11.5px;color:var(--muted)}
.pill b{color:var(--text);font-weight:700}
nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--surface);border-top:1px solid var(--border);display:flex;overflow-x:auto}
nav button{flex:1;min-width:66px;background:none;border:0;color:var(--dim);padding:11px 5px 12px;font:600 11.5px 'Outfit';cursor:pointer;border-top:2px solid transparent}
nav button.on{color:var(--accentInk);border-top-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r)}
.grid{display:grid;gap:12px}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}}
.hd{font:700 11px 'Outfit';letter-spacing:.09em;text-transform:uppercase;color:var(--dim);padding:11px 11px 9px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.hd b{color:var(--text);font-size:14px;letter-spacing:0;text-transform:none}
.note{color:var(--dim);font-size:12.5px;line-height:1.6}
.hint{color:var(--dim);font-size:12px;line-height:1.55;margin:6px 0 0}
.eyebrow{font:700 10px 'Outfit';letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}
.hidden{display:none}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--cardAlt);border:1px solid var(--borderL);color:var(--text);padding:9px 14px;border-radius:9px;font:600 13px 'Outfit';cursor:pointer}
.btn:hover{border-color:var(--accent)} .btn:disabled{opacity:.4;cursor:default}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
.btn.dgr{color:var(--loss);border-color:color-mix(in srgb,var(--loss) 40%,transparent)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.chip{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:8px 14px;border-radius:99px;font:600 13px 'Outfit';cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
.tdot{width:11px;height:11px;border-radius:3px;flex:none;display:inline-block}

.refWrap{position:fixed;inset:0;z-index:95;background:var(--bg);overflow:auto;padding:12px 10px 40px}
.refInner{max-width:900px;margin:0 auto}
.refTop{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.refTop .ttl{flex:1;min-width:0;font:400 19px 'Anton';letter-spacing:.03em;text-transform:uppercase}
.refTop .sub2{font:700 10px 'Outfit';color:var(--dim);text-transform:uppercase;letter-spacing:.1em;margin-top:2px}
.rcourt{display:grid;grid-template-columns:1fr 8px 1fr;border-radius:14px;overflow:hidden;border:3px solid #f4f8fb;margin-bottom:10px;box-shadow:0 2px 14px rgba(0,0,0,.25);user-select:none}
.rnet{background:repeating-linear-gradient(180deg,#f8fafc 0 4px,#94a3b8 4px 8px)}
.rpanel{border:0;background:#1d4f7a;color:#fff;font-family:'Outfit';display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:24px 10px 18px;cursor:pointer;position:relative;min-height:250px}
.rpanel.r2{background:#17608a}
.rpanel:active:not(:disabled){filter:brightness(1.18)}
.rpanel:disabled{cursor:default}
.rpanel .stripe{position:absolute;top:0;left:0;right:0;height:8px}
.rpanel .rtn{font:800 15px 'Outfit';text-align:center;line-height:1.2;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.rpanel .rpr{font:600 13.5px 'Outfit';opacity:.88;text-align:center}
.rpanel .rsc{font:400 96px 'Anton';line-height:1;text-shadow:0 2px 10px rgba(0,0,0,.35)}
.rpanel .rtap{font:800 9px 'Outfit';letter-spacing:.12em;opacity:.6;text-transform:uppercase}
.rpanel.win .rsc{color:#fde047}
.gamept{border-radius:9px;padding:9px 11px;font:700 12.5px 'Outfit';text-align:center;margin-bottom:9px;background:color-mix(in srgb,var(--gold) 12%,transparent);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);color:var(--goldInk)}
.gamept.win{background:color-mix(in srgb,var(--mint) 12%,transparent);border-color:color-mix(in srgb,var(--mint) 45%,transparent);color:var(--mintInk)}
.gamept.golden{background:color-mix(in srgb,var(--loss) 12%,transparent);border-color:color-mix(in srgb,var(--loss) 48%,transparent);color:var(--lossInk);animation:pulse 1.4s ease-in-out infinite}
.ctrls{display:grid;gap:8px;margin-bottom:10px}
@media(min-width:620px){.ctrls{grid-template-columns:1fr 1fr}}
.ctrlrow{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--border);border-radius:11px;padding:8px 10px}
.ctrlrow .tl{flex:1;min-width:0;font-size:12.5px;font-weight:700}
.rbtn{width:46px;height:40px;border-radius:9px;border:1px solid var(--borderL);background:var(--cardAlt);color:var(--text);font:400 22px 'Anton';cursor:pointer;flex:none;line-height:1}
.rbtn:disabled{opacity:.35;cursor:default}
.rbtn.plus{border:0;color:#221a34}
.bigok{width:100%;margin:6px 0 10px;border:none;padding:16px;font:800 15px 'Outfit';border-radius:12px;cursor:pointer;background:var(--mint);color:#fff}
@media(max-width:620px){.rpanel{min-height:210px}.rpanel .rsc{font-size:76px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* the Pickleboss game rules, plus what this format needs on top:

/* ---------- seeded randomness, so every phone draws the same pairs ---------- */
function hstr(s){ let h=1779033703^s.length; for(let i=0;i<s.length;i++){ h=Math.imul(h^s.charCodeAt(i),3432918353); h=h<<13|h>>>19; } return h>>>0; }
function rng(seedStr){ let a=hstr(seedStr); return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function shuffle(arr,r){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); const t=arr[i]; arr[i]=arr[j]; arr[j]=t; } return arr; }
function pairsFor(split,r){ const p=SPLITS[split].map(x=>x.slice()); return r()<.5?p:[p[1],p[0]]; }
function splitOf(p){ if(!p||!p[0]) return -1; const k=p[0].slice().sort().join(','); return SPLITS.findIndex(s=>s.some(x=>x.join(',')===k)); }
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

const newGame=()=>({a:null,b:null,live:false,log:[],ends:false});
function freshTeams(){ return TEAMS0.map(t=>({id:t.id,name:t.name,hex:t.hex,ink:t.ink,cap:null,players:t.p.map((n,i)=>({id:t.id+'_'+i,name:n}))})); }
function newTeam(st){ let n=1; while(st.teams.some(t=>t.id==='t'+n)) n++; const id='t'+n, used=st.teams.map(t=>t.hex);
  const pc=PALETTE.find(p=>used.indexOf(p[0])<0)||PALETTE[(n-1)%PALETTE.length];
  return {id,name:'Team '+n,hex:pc[0],ink:pc[1],cap:null,players:[0,1,2,3].map(i=>({id:id+'_'+i,name:'Player '+(i+1)}))}; }
function newTie(id,x){ return Object.assign({id,a:null,b:null,pa:null,pb:null,g:[newGame(),newGame(),newGame()]},x); }

/* ---------- the schedule ----------
   Round robin by the circle method (a bye each round when the count is odd).
   A tie is two games back to back on one court; when a round has more ties
   than there are courts it runs in waves. The knockouts follow the league
   and use as many courts as there are — both games of a knockout tie at the
   same time when two courts are free, since the four players split. */
function rrRounds(n){ const ids=[...Array(n).keys()]; if(n%2) ids.push(-1); const m=ids.length, out=[];
  for(let r=0;r<m-1;r++){ const rd=[]; for(let i=0;i<m/2;i++){ const x=ids[i], y=ids[m-1-i]; if(x>=0&&y>=0) rd.push([x,y]); }
    out.push(rd); ids.splice(1,0,ids.pop()); }
  return out; }
function koSlots(C,b){
  if(C>=4) return [['SF1',[0,1],[b,b]],['SF2',[2,3],[b,b]],['PO',[0,1],[b+1,b+1]],['F',[0,1],[b+2,b+2]]];
  if(C===3) return [['SF1',[0,1],[b,b]],['SF2',[2,2],[b,b+1]],['PO',[0,1],[b+2,b+2]],['F',[0,1],[b+3,b+3]]];
  if(C===2) return [['SF1',[0,1],[b,b]],['SF2',[0,1],[b+1,b+1]],['PO',[0,1],[b+2,b+2]],['F',[0,1],[b+3,b+3]]];
  return [['SF1',[0,0],[b,b+1]],['SF2',[0,0],[b+2,b+3]],['PO',[0,0],[b+4,b+5]],['F',[0,0],[b+6,b+7]]];
}
function buildTies(st){
  const C=Math.max(1,st.courts.length), out=[]; let k=1, slot=0;
  rrRounds(st.teams.length).forEach((rd,ri)=>{ const waves=Math.ceil(rd.length/C);
    rd.forEach((pr,i)=>{ const w=Math.floor(i/C), c=(i+ri)%C;
      out.push(newTie('L'+(k++),{stage:'league',round:ri+1,a:st.teams[pr[0]].id,b:st.teams[pr[1]].id,gc:[c,c],gs:[slot+2*w,slot+2*w+1]})); });
    slot+=2*waves; });
  koSlots(C,slot).forEach(([id,gc,gs])=>out.push(newTie(id,{stage:'ko',round:0,gc,gs})));
  return out;
}
/* more or fewer courts: same ties, same scores, new times and courts */
function reslot(st){ const by={}; buildTies(st).forEach(t=>by[t.id]=t);
  st.ties.forEach(m=>{ const f=by[m.id]; if(f&&f.a===m.a&&f.b===m.b||f&&m.stage==='ko'){ m.gc=f.gc; m.gs=f.gs; m.round=f.round; } }); }
/* teams added or removed: a brand-new schedule, fresh pairs, no scores */
function rebuild(st){ st.ties=buildTies(st); st.epoch=uid(); drawLeague(st,false); }

/* ---------- random pairs, spread evenly ----------
   Each of a team's ties uses one of the three splits, and a split decides
   every player's partner at once — so spreading the splits evenly spreads
   every player's partners evenly. Counts never differ by more than one
   (with 5 ties: 2, 2 and 1), and the same split never comes two ties
   running, so nobody keeps a partner from one tie to the next. */
function balancedSeq(L,fixed,r){
  const base=Math.floor(L/3), used=[0,0,0]; fixed.forEach(s=>{ if(s>=0) used[s]++; });
  const order=shuffle([0,1,2],r).sort((x,y)=>used[y]-used[x]);
  const want=[base,base,base]; order.slice(0,L%3).forEach(s=>want[s]++);
  const cnt=want.map((w,s)=>Math.max(0,w-used[s])), seq=fixed.slice();
  for(let i=0;i<L;i++){ if(seq[i]>=0) continue;
    const prev=i>0?seq[i-1]:-1, next=(i+1<L&&fixed[i+1]>=0)?fixed[i+1]:-1;
    let opts=[0,1,2].filter(s=>cnt[s]>0&&s!==prev&&s!==next);

    plan.forEach(p=>{ p.m.st[p.sd]=[p.L[0].act,p.L[1].act,p.dec]; });
  });
}
/* ---------- knockout timetable ----------
   Both games of a knockout tie go on at once when two courts are free and
   sooner that way; a tie with a stand-in plays its games back to back on one
   court (nobody can be on two courts at once). Later ties move to fit. */
function koLayout(){
  const C=Math.max(1,S.courts.length), L=LEAGUE(), b=L.length?Math.max(...L.map(m=>Math.max(...m.gs)))+1:0;
  const free=Array(C).fill(b), end={}, dep={SF1:[],SF2:[],PO:['SF1','SF2'],F:['SF1','PO']};
  ['SF1','SF2','PO','F'].forEach(id=>{ const m=tieById(id); if(!m) return; const dec=tieRes(m).needDec?1:0;
    if(tieStarted(m)&&m.gc&&m.gs){ const e=Math.max(...m.gs)+1+dec; m.gc.forEach(c=>{ if(c<C) free[c]=Math.max(free[c],e); }); end[id]=e; return; }
    const e=Math.max(b,...dep[id].map(d=>end[d]==null?b:end[d]));
    const order=[...Array(C).keys()].sort((x,y)=>(Math.max(free[x],e)-Math.max(free[y],e))||(x-y)), c0=order[0];
    const sSt=Math.max(e,free[c0]), sEnd=sSt+2; let par=null;
    if(C>=2&&!hasStandIn(m)){ const c1=order[1], st=Math.max(e,free[c0],free[c1]); par={c:[Math.min(c0,c1),Math.max(c0,c1)],st,end:st+1}; }
    if(par&&par.end<sEnd){ m.gc=par.c.slice(); m.gs=[par.st,par.st]; free[par.c[0]]=par.end+dec; free[par.c[1]]=par.end; end[id]=par.end+dec; }
    else { m.gc=[c0,c0]; m.gs=[sSt,sSt+1]; free[c0]=sEnd+dec; end[id]=sEnd+dec; } });
}

/* ===================== standings ===================== */
function h2h(x,y){ const m=LEAGUE().find(m=>(m.a===x&&m.b===y)||(m.a===y&&m.b===x)); if(!m) return 0;
  const r=tieRes(m); if(!r.over) return 0; const gx=m.a===x?r.ga:r.gb, gy=m.a===x?r.gb:r.ga;
  if(gx!==gy) return gx>gy?1:-1; const px=m.a===x?r.pa:r.pb, py=m.a===x?r.pb:r.pa; return px>py?1:px<py?-1:0; }
function standings(){
  const acc={}; S.teams.forEach((t,i)=>{acc[t.id]={team:t,ix:i,p:0,w:0,d:0,l:0,gw:0,gl:0,pf:0,pa:0};});
  LEAGUE().forEach(m=>{ const A=acc[m.a],B=acc[m.b]; if(!A||!B) return;
    m.g.slice(0,2).forEach(g=>{ if(!gDone(g)) return; A.pf+=g.a; A.pa+=g.b; B.pf+=g.b; B.pa+=g.a; if(g.a>g.b){A.gw++;B.gl++;} else {B.gw++;A.gl++;} });
    const r=tieRes(m); if(!r.over) return; A.p++; B.p++;
    if(r.ga===2){A.w++;B.l++;} else if(r.gb===2){B.w++;A.l++;} else {A.d++;B.d++;} });
  const list=Object.values(acc); list.forEach(r=>{ r.pts=r.gw+r.w; r.diff=r.pf-r.pa; });
  const lvl=(p,q)=>(q.pts-p.pts)||(q.diff-p.diff);
  list.sort((p,q)=>lvl(p,q)||(p.ix-q.ix));
  const out=[];
  for(let i=0;i<list.length;){ let j=i+1; while(j<list.length&&lvl(list[i],list[j])===0) j++;
    const blk=list.slice(i,j);
    blk.sort((p,q)=>{ if(blk.length===2){ const h=h2h(q.team.id,p.team.id); if(h) return h; } return (q.pf-p.pf)||(p.ix-q.ix); });
    out.push(...blk); i=j; }
  out.forEach((r,i)=>r.rank=i+1); return out;
}

/* ===================== knockouts ===================== */
/* how often a team has used each split, in the ties before this one */
function splitsUsed(tid,before){ const n=[0,0,0]; let last=-1;
  for(const m of S.ties){ if(m===before) break; const s=splitOf(m.a===tid?m.pa:m.b===tid?m.pb:null); if(s>=0){ n[s]++; last=s; } }
  return {n,last}; }
function lastSplit(tid,before){ return splitsUsed(tid,before).last; }
/* the least-used split, avoiding the ones listed (trying each list in turn) */
function pickSplit(n,avoidLists,r){
  for(const av of avoidLists.concat([[]])){ const opts=[0,1,2].filter(s=>av.indexOf(s)<0); if(!opts.length) continue;
    const mn=Math.min(...opts.map(s=>n[s])), best=opts.filter(s=>n[s]===mn); return best[Math.floor(r()*best.length)]; }
  return 0; }
function koPairs(m,tid){ const r=rng(S.seed+'|ko|'+m.id+'|'+tid), u=splitsUsed(tid,m); return pairsFor(pickSplit(u.n,[[u.last]],r),r); }
/* how many ties each pair of teammates has played together (scheduled so far) */
function partnerCounts(t){ const c={}; for(let i=0;i<SQUAD;i++) for(let j=i+1;j<SQUAD;j++) c[i+'-'+j]=0;
  S.ties.forEach(m=>{ const p=m.a===t.id?m.pa:m.b===t.id?m.pb:null; if(!p) return;
    p.forEach(pr=>{ const k=Math.min(pr[0],pr[1])+'-'+Math.max(pr[0],pr[1]); if(c[k]!=null) c[k]++; }); });
  return c; }
function setKO(m,a,b){
  a=a||null; b=b||null; if(tieStarted(m)) return;
  if(m.a===a&&m.b===b){ if(a&&!m.pa) m.pa=koPairs(m,a); if(b&&!m.pb) m.pb=koPairs(m,b); return; }
  if(m.a!==a){ m.a=a; m.pa=a?koPairs(m,a):null; }
  if(m.b!==b){ m.b=b; m.pb=b?koPairs(m,b):null; }
}
function syncKO(){
  const st=leagueDone()?standings():null, sf1=tieById('SF1'), sf2=tieById('SF2'), po=tieById('PO'), f=tieById('F');
  setKO(sf1,st&&st[0].team.id,st&&st[1].team.id); setKO(sf2,st&&st[2].team.id,st&&st[3].team.id);
  const r1=tieRes(sf1), r2=tieRes(sf2), l1=r1.winner?(r1.winner===sf1.a?sf1.b:sf1.a):null;
  setKO(po,l1,r2.winner); setKO(f,r1.winner,tieRes(po).winner);
}
function champions(){ const f=tieById('F'), po=tieById('PO'), rf=tieRes(f), rp=tieRes(po), o={};
  if(rf.winner){ o.gold=teamById(rf.winner); o.silver=teamById(rf.winner===f.a?f.b:f.a); }
  if(rp.winner) o.bronze=teamById(rp.winner===po.a?po.b:po.a);
  return o; }
function refresh(){ S.rules=normRules(S.rules); syncKO(); computeSubs(); koLayout(); }

/* ===================== player stats & MVP ===================== */
function playerStats(){
  const P={}, PR={}; let games=0, skipped=0;
  S.teams.forEach(t=>t.players.forEach(p=>{P[p.id]={p,team:t,gp:0,gw:0,gl:0,pf:0,pa:0,kp:0,kw:0,kpf:0,kpa:0,cw:0,cl:0};}));
  S.ties.forEach(m=>{ if(!m.a||!m.b) return;
    [0,1,2].forEach(gi=>{ const g=m.g[gi]; if(!gDone(g)) return; if(g.ff){ skipped++; return; } const [pa,pb]=gPairs(m,gi); if(!pa||!pb) return; games++;
      const close=Math.abs(g.a-g.b)<=2, ko=m.stage==='ko';
      [[m.a,pa,g.a,g.b],[m.b,pb,g.b,g.a]].forEach(([tid,pair,f,ag])=>{ const t=teamById(tid), won=f>ag;
        pair.ids.forEach((id,k)=>{ if(!id){ if(pair.r[k]) skipped++; return; }
          if(!P[id]) P[id]={p:playerById(id)||{id,name:pair.pl[k].name},team:t,gp:0,gw:0,gl:0,pf:0,pa:0,kp:0,kw:0,kpf:0,kpa:0,cw:0,cl:0};
          const o=P[id]; o.gp++; won?o.gw++:o.gl++; o.pf+=f; o.pa+=ag;
          if(ko){ o.kp++; if(won) o.kw++; o.kpf+=f; o.kpa+=ag; } if(close){ won?o.cw++:o.cl++; } });
        if(pair.ids[0]&&pair.ids[1]){ const k=pair.ids.slice().sort().join('|'); if(!PR[k]) PR[k]={ids:pair.ids.slice(),team:t,gp:0,gw:0,gl:0,pf:0,pa:0};
          const q=PR[k]; q.gp++; won?q.gw++:q.gl++; q.pf+=f; q.pa+=ag; } }); }); });
  const fin=o=>{ o.diff=o.pf-o.pa; o.rate=o.gp?Math.round(o.gw/o.gp*1000)/10:0; o.avg=o.gp?Math.round(o.diff/o.gp*10)/10:0; return o; };
  return {players:Object.values(P).map(fin).filter(o=>o.gp>0), pairs:Object.values(PR).map(fin), games, skipped};
}
const mvpSort=(x,y)=>(y.diff-x.diff)||(y.rate-x.rate)||(y.gw-x.gw)||(y.pf-x.pf);
function mvpPick(R){
  if(S.mvp){ const p=playerById(S.mvp); if(p){ const o=R.players.find(x=>x.p.id===S.mvp)||{p,team:teamOfPlayer(S.mvp),gp:0,gw:0,gl:0,pf:0,pa:0,diff:0,rate:0};
    return {o,declared:true}; } }
  const s=R.players.slice().sort(mvpSort); return s.length?{o:s[0],declared:false}:null;
}

async function hashPin(p){ const salted='hs19|'+(sync.event||'')+'|'+p;

/* ---------- Live: what each court is playing now ---------- */
function courtGames(ci){ const out=[];
  S.ties.forEach(m=>{ [0,1].forEach(gi=>{ if(m.gc[gi]===ci) out.push({m,gi,sl:m.gs[gi]}); });
    if(m.stage==='ko'&&m.gc[0]===ci&&tieRes(m).needDec) out.push({m,gi:2,sl:decSlot(m)}); });
  return out.sort((x,y)=>(x.sl-y.sl)||((y.gi===2?1:0)-(x.gi===2?1:0)));
}
const gameOpen=e=>e.m.a&&e.m.b&&!gDone(e.m.g[e.gi]);
function gLabel(e){ return tieTitle(e.m)+' · '+gName(e.gi)+' · '+fmtTime(e.sl); }
function vLive(){
  const ch=champions(); let h='';
  if(ch.gold) h+=`<div class="winbanner"><div style="font-size:28px">🏆</div><div class="eyebrow" style="color:var(--accentInk)">Champions</div><div class="wn" style="color:${tcol(ch.gold)}">${esc(ch.gold.name)}</div></div>`;
  h+=`<p class="note" style="margin:0 0 12px">Each card shows the game due on that court now. Tap it to follow it point by point${canScore()?' or to run its console':''}. Every tie is two doubles games; pairs are drawn at random for each tie. Each game ${esc(rulesShort())}.</p><div class="grid g3">`;
  h+=S.courts.map((nm,ci)=>{
    const all=courtGames(ci).filter(e=>e.m.stage==='league'||e.m.a||e.m.b), done=all.filter(e=>gDone(e.m.g[e.gi])).length;
    const idx=all.findIndex(gameOpen), e=idx>=0?all[idx]:null, nx=idx>=0?all.slice(idx+1).find(x=>x.m.a&&x.m.b):null;
    const prog=`<div class="prog"><i style="width:${all.length?done/all.length*100:0}%"></i></div>`;
    if(!e) return `<div class="card ccard" style="cursor:default"><div class="ccTop"><span class="ccName">${esc(nm)}</span><span class="eyebrow">${done} played</span></div>
      <div class="note">${leagueDone()?'Nothing more ready here right now.':'Waiting for teams to be decided.'}</div>${prog}</div>`;
    const A=teamById(e.m.a), B=teamById(e.m.b), g=e.m.g[e.gi], [pa,pb]=gPairs(e.m,e.gi), live=g.live, st=gStarted(g);
    return `<div class="card ccard ${live?'live':''}" onclick="openRef('${e.m.id}',${e.gi})">
      <div class="ccTop"><span class="ccName">${esc(nm)}</span><span class="stchip ${e.gi===2?'st-dec':live?'st-live':'st-wait'}">${live?'● ':''}${esc(gLabel(e))}</span></div>
      <div class="ccVs"><div class="ccTeam" style="color:${tcol(A)}">${esc(A.name)}<small>${pairTxt(A,pa)}</small></div>
        <div class="ccSc">${st?(g.a??0)+'–'+(g.b??0):'v'}</div>
        <div class="ccTeam r" style="color:${tcol(B)}">${esc(B.name)}<small>${pairTxt(B,pb)}</small></div></div>
      ${nx?`<div class="ccNext">Next: <b>${esc(teamById(nx.m.a).name)}</b> (${pairTxt(teamById(nx.m.a),gPairs(nx.m,nx.gi)[0])}) v <b>${esc(teamById(nx.m.b).name)}</b> (${pairTxt(teamById(nx.m.b),gPairs(nx.m,nx.gi)[1])}) · ${fmtTime(nx.sl)}</div>`:''}
      ${prog}</div>`;
  }).join('');
  return h+'</div>';
}

/* ---------- Matches ---------- */
function modeBar(){
  if(!canScore()) return '';
  return `<div class="row" style="margin-bottom:12px;align-items:center">
    <button class="chip ${S.mode==='entry'?'on':''}" onclick="S.mode='entry';quietSave();render()">⌨ Type final scores</button>
    <button class="chip ${S.mode==='ref'?'on':''}" onclick="S.mode='ref';quietSave();render()">🏓 Court console</button>
    <span class="note">${S.mode==='entry'?'Type each game\'s final score — Tab or Enter moves on.':'Tap SCORE on a game to count it point by point; every phone sees it live.'}</span></div>`;
}
function oddBanner(){ if(!canScore()) return ''; const L=[];
  S.ties.forEach(m=>{ if(!m.a||!m.b) return; m.g.forEach((g,gi)=>{ const why=oddGame(g,gi); if(why) L.push(tieTitle(m)+' · '+gName(gi).toLowerCase()+' · '+g.a+'–'+g.b+' ('+why+')'); }); });
  return L.length?`<div class="alert warn"><span>⚠</span><span><b>${L.length===1?'This score doesn\'t':'These scores don\'t'} fit the rules</b> (${esc(rulesShort())}) — check ${L.length===1?'it':'them'}. A level score doesn't count until it's fixed; the rest count as entered.
    <ul>${L.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul></span></div>`:''; }
function tieCard(m,ci){
  const A=teamById(m.a), B=teamById(m.b), r=tieRes(m), has=!!(A&&B), seeds=m.stage==='ko'?KO_BY[m.id].seeds:['',''];
  const chip=r.over?'<span class="stchip st-done">Done</span>':r.needDec?'<span class="stchip st-dec">Decider needed</span>':tieStarted(m)?'<span class="stchip st-live">● Live</span>':'<span class="stchip st-wait">Up next</span>';
  const side=(t,tid,seed,right)=>{ const dot=`<span class="tdot" style="background:${t?t.hex:'var(--border)'}"></span>`;
    return `<div class="tteam ${right?'r':''} ${r.winner?(r.winner===tid?'w':'l'):''}">${right?'':dot}${t?esc(t.name):`<span class="tbd">${esc(seed)}</span>`}${right?dot:''}</div>`; };
  let h=`<div class="card tie" id="tie_${m.id}"><div class="tieHead"><span class="tieT">${esc(tieTitle(m))}</span><span class="tieMeta">${esc(tieWhere(m))}</span>${chip}</div>
    <div class="tieVs">${side(A,m.a,seeds[0],false)}<div class="tsc">${r.done||tieStarted(m)?r.ga+'–'+r.gb:'v'}<small>games</small></div>${side(B,m.b,seeds[1],true)}</div>`;
  if(m.stage==='league'&&r.over) h+=`<div class="tptsLine">League points: ${esc(A.name)} +${leaguePts(r,'a')} · ${esc(B.name)} +${leaguePts(r,'b')}</div>`;
  if(m.stage==='ko'&&r.over) h+=`<div class="tptsLine">${esc(teamById(r.winner).name)} win ${esc(r.how)}</div>`;
  if(r.needDec&&!r.over) h+=`<div class="tptsLine" style="color:var(--lossInk)">1–1 and level on total points (${r.pa}–${r.pb}) — play the decider to ${S.rules.decTo}</div>`;
  [0,1,2].filter(gi=>(gi<2||r.needDec)&&(ci==null||gCourt(m,gi)===ci)).forEach(gi=>{ h+=gameRow(m,gi); });
  if(ci!=null&&m.gc[0]!==m.gc[1]) h+=`<div class="tptsLine" style="padding-top:8px">The other game of this tie is on ${esc(courtName(m.gc[0]===ci?m.gc[1]:m.gc[0]))}.</div>`;
  if(canScore()&&has) h+=`<div class="tieFoot"><span class="note">${tieStarted(m)?'Pairs are locked once scoring starts.':'Pairs drawn at random.'}</span>
    <span class="row" style="gap:6px"><button class="btn sm" onclick="openModal(forfeitModal('${m.id}'))">⚑ Forfeit</button><button class="btn sm" onclick="openModal(pairsModal('${m.id}'))">✎ Pairs</button></span></div>`;
  return h+'</div>';
}
function gameRow(m,gi){
  const A=teamById(m.a), B=teamById(m.b), g=m.g[gi], [pa,pb]=gPairs(m,gi), has=!!(A&&B);
  const win=gDone(g)?(g.a>g.b?'a':'b'):null, odd=!!oddGame(g,gi), entry=canScore()&&has&&S.mode==='entry'&&!g.live;
  const box=sd=>entry?`<input class="sc bx-${sd} ${g[sd]!=null?'filled':''} ${odd?'odd':''}" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="2"
      data-k="${m.id}:${gi}:${sd}" value="${g[sd]??''}" oninput="scoreInput(this)" onchange="scoreCheck(this)" onfocus="this.select()" onclick="event.stopPropagation()">`
    :`<div class="scv bx-${sd} ${win===sd?'w':''} ${g.live?'lv':''}">${g[sd]??'–'}</div>`;
  const pcell=(t,p,sd)=>`<div class="gp ${sd} ${win?(win===sd?'w':'l'):''}">${t?`<span class="tdot" style="background:${t.hex}"></span>`:''}<span>${t?(g.ff===sd?'<span style="color:var(--lossInk)">forfeited</span>':pairTxt(t,p)):'—'}</span></div>`;
  let btn=''; if(has&&canScore()&&S.mode==='ref') btn=`<button class="refbtn ${g.live?'go':''}" onclick="event.stopPropagation();openRef('${m.id}',${gi})">${gDone(g)?'VIEW':g.live?'RESUME':'SCORE'}</button>`;
  const click=has&&!entry;
  return `<div class="grow ${click?'click':''}" ${click?`onclick="openRef('${m.id}',${gi})"`:''}><div class="gmeta"><b>${g.live?'<span class="liveDot">● </span>':''}${gName(gi)}${odd?' <span style="color:var(--gold)" title="Check this score">⚠</span>':''}${g.ff?' <span class="stchip st-dec" style="padding:1px 6px">forfeit</span>':''}</b><span>${fmtTime(gSlot(m,gi))} · ${esc(courtName(gCourt(m,gi)))}</span></div>
    ${pcell(A,pa,'a')}${box('a')}<span class="sep">–</span>${box('b')}${pcell(B,pb,'b')}${btn}</div>`;
}
function roundsCount(){ return LEAGUE().reduce((n,m)=>Math.max(n,m.round),0); }
function roundSlots(r){ const ts=LEAGUE().filter(m=>m.round===r); if(!ts.length) return [0,0];
  return [Math.min(...ts.map(m=>Math.min(...m.gs))), Math.max(...ts.map(m=>Math.max(...m.gs)))+1]; }
function roundSpan(r){ const s=roundSlots(r); return fmtTime(s[0])+'–'+fmtTime(s[1]); }
function koStart(){ return Math.min(...KOS().map(m=>Math.min(...m.gs))); }
function eventEnd(){ return Math.max(...S.ties.map(m=>Math.max(...m.gs)))+1; }
const roundTies=r=>LEAGUE().filter(m=>m.round===r).sort((x,y)=>(x.gs[0]-y.gs[0])||(x.gc[0]-y.gc[0]));
function vMatches(){
  let h=modeBar()+oddBanner()+exportBar('matches');
  for(let r=1;r<=roundsCount();r++){ const ts=roundTies(r);
    h+=section('r'+r,'Round '+r,roundSpan(r),ts.filter(m=>tieRes(m).over).length,ts.length,()=>`<div class="ties">${ts.map(tieCard).join('')}</div>`); }
  h+=section('rk','Knockouts',fmtTime(koStart())+' onwards',KOS().filter(m=>tieRes(m).over).length,4,()=>`<div class="ties">${KOS().map(tieCard).join('')}</div>
    ${leagueDone()?'':'<p class="note">Teams fill in automatically when all '+LEAGUE().length+' league ties are finished.</p>'}`);
  return h;
}

/* ---------- Stats & MVP ---------- */
/* Every ranking on the Stats tab, worked out once and used by the screen,
   the shared picture and the PDF alike. Players and pairs can be ranked the
   MVP way (points +/-, then win rate) or by win rate. Ranked by win rate,
   anyone with fewer than half the games of the busiest player is listed
   below the ranking — 1 from 1 isn't 100% in any useful sense. */
const STATS_VIEWS=[['players','Players'],['pairs','Pairs'],['ko','Knockouts'],['close','Close games']];
const rateSort=(x,y)=>(y.rate-x.rate)||(y.gp-x.gp)||(y.diff-x.diff)||(y.gw-x.gw);
const sgn=d=>(d>0?'+':'')+d;
function statsData(view,sort){
  const R=playerStats(); view=view||'players'; sort=(view==='players'||view==='pairs')?(sort==='rate'?'rate':'mvp'):'mvp';
  const pl=o=>o.p?o.p.name:o.ids.map(id=>{ const p=playerById(id); return p?shortName(p):'?'; }).join(' & ');
  let list, cols, title, kicker, note, topLabel;
  if(view==='pairs'){ list=R.pairs.slice(); title=sort==='rate'?'Pairs by win rate':'MVP pairs'; kicker='Best pair';
    cols=sort==='rate'?[['Games',o=>o.gp],['W–L',o=>o.gw+'–'+o.gl],['Win %',o=>o.rate+'%',1],['+/-',o=>sgn(o.diff)]]
      :[['Games',o=>o.gp],['W–L',o=>o.gw+'–'+o.gl],['Pts won',o=>o.pf],['+/-',o=>sgn(o.diff),1],['Win %',o=>o.rate+'%']];
    note='Every partnership the draw put together. Stand-in and forfeited games are left out.'; }
  else if(view==='ko'){ list=R.players.filter(o=>o.kp>0).map(o=>Object.assign({},o,{kd:o.kpf-o.kpa})); title='Knockout players'; kicker='Top in the knockouts';
    cols=[['Games',o=>o.kp],['Won',o=>o.kw,1],['+/-',o=>sgn(o.kd)]]; note='Only games from the semi-finals, Playoff and Final.'; }
  else if(view==='close'){ list=R.players.filter(o=>o.cw+o.cl>0); title='Close games'; kicker='Holds their nerve';
    cols=[['Close games',o=>o.cw+o.cl],['Won',o=>o.cw,1],['Lost',o=>o.cl]]; note='Games decided by 2 points or fewer.'; }
  else { list=R.players.slice(); title=sort==='rate'?'Players by win rate':'MVP ranking'; kicker=sort==='rate'?'Highest win rate':'MVP';
    cols=sort==='rate'?[['Games',o=>o.gp],['W–L',o=>o.gw+'–'+o.gl],['Win %',o=>o.rate+'%',1],['+/-',o=>sgn(o.diff)]]
      :[['Games',o=>o.gp],['W–L',o=>o.gw+'–'+o.gl],['Pts won',o=>o.pf],['+/-',o=>sgn(o.diff),1],['Avg',o=>sgn(o.avg)],['Win %',o=>o.rate+'%']];
    note=sort==='rate'?'Win rate = games won ÷ games played.':'Ranked on points +/-, then win rate. Avg = +/- per game.'; }
  let ranked=list, unranked=[];
  if(view==='ko') ranked.sort((x,y)=>(y.kw-x.kw)||(y.kd-x.kd));
  else if(view==='close') ranked.sort((x,y)=>(y.cw-x.cw)||(x.cl-y.cl));
  else if(sort==='rate'){ const most=list.reduce((n,o)=>Math.max(n,o.gp),0), min=Math.ceil(most/2);
    ranked=list.filter(o=>o.gp>=min).sort(rateSort); unranked=list.filter(o=>o.gp<min).sort(rateSort);
    if(unranked.length) note+=` Ranked: at least ${min} game${min>1?'s':''} (half of the most anyone has played).`; }
  else ranked.sort(mvpSort);
  ranked.forEach((o,i)=>{ o.rank=i+1; }); unranked.forEach(o=>{ o.rank=null; });
  let top=ranked[0]||null, declared=false;
  if(view==='players'&&sort==='mvp'){ const pk=mvpPick(R); if(pk){ top=pk.o; declared=pk.declared; } }
  return {R,view,sort,title,kicker:declared?'Most valuable player':(view==='players'&&sort==='mvp'?'MVP · leading on the stats':kicker),
    cols,rows:ranked.concat(unranked),ranked:ranked.length,top,name:pl,note:note+(R.skipped&&view!=='ko'&&view!=='close'?'':''),games:R.games,skipped:R.skipped};
}
function vStats(){
  const R=playerStats(); let h=exportBar('stats');
  if(!R.players.length) return h+`<div class="card ed" style="text-align:center"><div style="font-size:30px;opacity:.4">📊</div>
    <p class="note">No finished games yet. Player stats build up from every game score — typed or scored on the console — because each game's pair is known.</p></div>`;
  const view=STATS_VIEWS.some(v=>v[0]===S.statsView)?S.statsView:'players', D=statsData(view,S.statsSort), top=D.top;
  h+=`<div class="chips">${STATS_VIEWS.map(v=>`<div class="chip ${view===v[0]?'on':''}" onclick="S.statsView='${v[0]}';quietSave();render()">${v[1]}</div>`).join('')}</div>`;
  if(view==='players'||view==='pairs') h+=`<div class="row" style="align-items:center;margin:-4px 0 12px"><span class="note">Rank by</span>
    <button class="chip ${D.sort==='mvp'?'on':''}" style="padding:6px 12px" onclick="S.statsSort='mvp';quietSave();render()">MVP ranking (+/-)</button>
    <button class="chip ${D.sort==='rate'?'on':''}" style="padding:6px 12px" onclick="S.statsSort='rate';quietSave();render()">Win rate</button></div>`;
  if(top){ const tm=top.team, a=D.cols;

/* ---------- Teams ---------- */
function teamTies(tid){ return S.ties.filter(m=>(m.a===tid||m.b===tid)&&(m.stage==='league'||(m.a&&m.b))); }
/* a team's ties, in playing order, with the opponent and each game's pairs from this team's side */
function teamFixtures(tid){
  return S.ties.filter(m=>m.a===tid||m.b===tid).sort((x,y)=>Math.min(...x.gs)-Math.min(...y.gs)).map(m=>{
    const us=m.a===tid?'a':'b', them=us==='a'?'b':'a', r=tieRes(m), opp=teamById(m[them]);
    const games=[0,1,2].filter(gi=>gi<2||r.needDec).map(gi=>{ const g=m.g[gi], pr=gPairs(m,gi);
      return {gi, court:gCourt(m,gi), slot:gSlot(m,gi), mine:pr[us==='a'?0:1], theirs:pr[us==='a'?1:0], f:g[us], ag:g[them], done:gDone(g), live:g.live}; });
    return {m, us, opp, games, gw:us==='a'?r.ga:r.gb, gl:us==='a'?r.gb:r.ga, over:r.over, won:r.winner===tid, pts:m.stage==='league'&&r.over?leaguePts(r,us):null}; });
}

    <div class="prRow" style="flex-wrap:wrap;line-height:1.7"><span><b style="width:auto">Paired together:</b> ${partnerLine(t)}</span></div></div>`;

        <div class="scv bx-a ${g.done&&g.f>g.ag?'w':''}">${g.f??'–'}</div><span class="sep">–</span><div class="scv bx-b ${g.done&&g.ag>g.f?'w':''}">${g.ag??'–'}</div>

      <div class="hd" style="padding:10px 14px 4px"><span>Times paired together</span></div><div class="prRow" style="flex-wrap:wrap;line-height:1.7"><span>${partnerLine(t)}</span></div>

function partnerLine(t){ const pc=partnerCounts(t);
  return Object.keys(pc).map(k=>{ const [i,j]=k.split('-').map(Number); return esc(shortName(t.players[i]))+' &amp; '+esc(shortName(t.players[j]))+' <b style="width:auto;color:var(--accentInk)">×'+pc[k]+'</b>'; }).join(' · '); }
function setTeamName(id,v){ if(!canEditTeams()) return; v=(v||'').trim(); if(!v) return render(); teamById(id).name=v; save(); softRender(); toast('Saved'); }
function setPlayerName(id,v){ if(!canEditTeams()) return; const p=playerById(id); v=(v||'').trim(); if(!p||!v) return render(); p.name=v; save(); softRender(); toast('Saved'); }
function setOut(pid){ if(!canEditTeams()) return; const p=playerById(pid), t=teamOfPlayer(pid); if(!p||!t) return;
  p.out=!p.out; const left=t.players.filter(x=>!x.out).length; refresh(); save(); render();
  toast(p.out?(left>=2?p.name+' marked absent — teammates cover his games, spread evenly':p.name+' marked absent — '+t.name+' can\'t field a pair; their games will need forfeiting'):p.name+' is back from the next game'); if(sync.on) drainQueue(6); }

function replacePlayer(pid){ if(!canEditTeams()) return; const p=playerById(pid), t=teamOfPlayer(pid); if(!p||!t) return;
  const nm=(prompt('Name of the player replacing '+p.name+' (from the next game on):','')||'').trim(); if(!nm) return;
  const played=S.ties.some(m=>m.g.some(g=>gStarted(g)&&g.ln&&['a','b'].some(sd=>g.ln[sd]&&g.ln[sd].some(s=>s.id===pid))));
  if(played){ t.former=(t.former||[]).concat([{id:p.id,name:p.name}]); const i=t.players.indexOf(p), np={id:t.id+'_'+uid(),name:nm,out:false};
    if(t.cap===p.id) t.cap=np.id; if(S.mvp===p.id) S.mvp=''; t.players[i]=np; }
  else { p.name=nm; p.out=false; }
  refresh(); save(); render(); toast(nm+' replaces '+p.name+(played?' — earlier games stay under '+p.name:'')); if(sync.on) drainQueue(6); }
function setCaptain(tid,pid){ if(!canEditTeams()) return; const t=teamById(tid), p=playerById(pid); if(!t||!p) return; t.cap=pid; save(); render(); toast(p.name+' is now captain of '+t.name); }
function restoreRoster(){ if(!canEditTeams()) return; if(!confirm('Put the original team names, player names and captains back (teams added later keep their names)?')) return;
  const f=freshTeams(); S.teams.forEach(t=>{ const o=f.find(x=>x.id===t.id); if(!o) return; t.name=o.name; t.cap=null; t.players.forEach((p,j)=>{ p.name=o.players[j].name; }); });
  save(); render(); toast('Roster restored'); }

/* ---------- forfeits ----------
   A game a team can't (or won't) play goes to the other side at 0 to the
   game's target. It counts for the teams — the game, the points, the table —
   but for nobody's player stats: the winners didn't hit a ball either. */
function forfeitModal(id){
  const m=tieById(id); if(!m||!m.a||!m.b) return ''; const A=teamById(m.a), B=teamById(m.b), r=tieRes(m);
  const rows=[0,1,2].filter(gi=>gi<2||r.needDec).map(gi=>{ const g=m.g[gi], [pa,pb]=gPairs(m,gi);
    return `<div class="rsRow" style="flex-wrap:wrap"><div style="min-width:0;flex:1"><div class="rsT">${gName(gi)}${g.ff?' · forfeited by '+esc((g.ff==='a'?A:B).name):gDone(g)?' · played '+g.a+'–'+g.b:''}</div>
      <div class="rsN">${pairTxt(A,pa)} v ${pairTxt(B,pb)}</div></div>
      <div class="row" style="gap:6px"><button class="btn sm ${g.ff==='a'?'acc':''}" onclick="setForfeit('${id}',${gi},'a')">${esc(A.name)} forfeit</button>
      <button class="btn sm ${g.ff==='b'?'acc':''}" onclick="setForfeit('${id}',${gi},'b')">${esc(B.name)} forfeit</button>
      ${g.ff?`<button class="btn sm dgr" onclick="setForfeit('${id}',${gi},'')">Undo</button>`:''}</div></div>`; }).join('');
  return `<h3>Forfeit a game</h3><p class="hint">${esc(tieTitle(m))} · ${esc(A.name)} v ${esc(B.name)}. A forfeited game goes to the other team ${rulesShortR(gRules(0)).split(' ')[1]}–0: it counts for the teams (game, points, table) but not in any player's stats or the MVP.</p>
    ${rows}<button class="btn acc" style="width:100%;margin-top:10px" onclick="closeModal()">Done</button>`;
}
function setForfeit(id,gi,sd){ const m=tieById(id); if(!canScore()||!m) return; const g=m.g[gi];
  if(sd){ if(gStarted(g)&&!g.ff&&!confirm('This game already has a score ('+(g.a??0)+'–'+(g.b??0)+'). Replace it with a forfeit?')) return;
    const T=gRules(gi).T; m.g[gi]={a:sd==='a'?0:T,b:sd==='b'?0:T,live:false,log:[],ends:false,ff:sd}; stampLineup(m,gi); }
  else m.g[gi]=newGame();
  save(); openModal(forfeitModal(id)); toast(sd?'Forfeit recorded':'Forfeit removed'); }
/* ---------- pairs editor ---------- */
function pairsModal(id){
  const m=tieById(id); if(!m||!m.a||!m.b) return '';
  const locked=tieStarted(m);
  const blk=sd=>{ const tid=m[sd], t=teamById(tid), cur=m['p'+sd], cs=splitOf(cur), prev=lastSplit(tid,m);
    return `<div class="pmTeam"><div class="pmName"><span class="tdot" style="background:${t.hex}"></span>${esc(t.name)}</div>
      <div class="pmOpts">${SPLITS.map((s,si)=>`<button class="pmOpt ${si===cs?'on':''}" ${locked?'disabled':''} onclick="setSplit('${id}','${sd}',${si})">${pairTxt(t,s[0])}<br>${pairTxt(t,s[1])}</button>`).join('')}</div>
      <div class="row" style="align-items:center;margin-top:8px"><span class="note" style="flex:1">Game 1: <b>${pairTxt(t,cur&&cur[0])}</b> · Game 2: <b>${pairTxt(t,cur&&cur[1])}</b></span>
        <button class="btn sm" ${locked?'disabled':''} onclick="swapOrder('${id}','${sd}')">⇄ Swap games</button></div>
      ${cs>=0&&cs===prev?`<div class="alert warn" style="margin-top:8px"><span>⚠</span><span>Same partners as this team's previous tie.</span></div>`:''}
      <div class="note" style="margin-top:6px">Times paired so far: ${partnerLine(t)}</div>${standinBlock(m,sd)}</div>`; };
  return `<h3>Pairs · ${esc(tieTitle(m))}</h3><p class="hint">${esc(teamById(m.a).name)} v ${esc(teamById(m.b).name)} · ${esc(tieWhere(m))}</p>
    ${locked?'<div class="alert warn"><span>🔒</span><span>Scoring has started — clear the scores first to change these pairs.</span></div>':''}
    ${blk('a')}${blk('b')}
    <div class="row" style="margin-top:14px"><button class="btn" ${locked?'disabled':''} onclick="redrawTie('${id}')">🎲 Re-draw at random</button><button class="btn acc" style="flex:1" onclick="closeModal()">Done</button></div>`;
}
function standinBlock(m,sd){ const t=teamById(m[sd]); if(!t||!t.players.some(p=>p.out)) return '';
  const out=t.players.filter(p=>p.out).map(p=>esc(p.name)).join(', ');
  let h=`<div class="alert warn" style="margin-top:8px"><span>⚠</span><span><b>${out} absent.</b> `;
  const rows=[0,1].map(gi=>{ const L=lineFor(m,gi,sd), c=m.stc&&m.stc[sd]&&m.stc[sd][gi], locked=gStarted(m.g[gi]); if(!L) return '';
    const has=L.r.some(Boolean)||L.miss; if(!has&&!c) return '';
    let x=`${gName(gi)}: <b>${pairTxt(t,L)}</b>`;
    if(c&&!locked){ const ov=m.stx&&m.stx[sd]&&m.stx[sd][gi];
      x+=`<div class="row" style="gap:6px;margin-top:5px">${c.map(ix=>`<button class="btn sm ${String(ov)===String(ix)?'acc':''}" onclick="setStandin('${m.id}','${sd}',${gi},${ix})">${esc(shortName(t.players[ix]))} covers</button>`).join('')}
        <button class="btn sm ${ov==null?'acc':''}" onclick="setStandin('${m.id}','${sd}',${gi},null)">Auto (even spread)</button></div>`; }
    return x; }).filter(Boolean);
  return h+(rows.length?rows.join('<br>'):'No stand-in needed in this tie.')+'</span></div>';
}
function setStandin(id,sd,gi,ix){ const m=tieById(id); if(!canScore()||!m||gStarted(m.g[gi])) return;
  m.stx=m.stx||{}; m.stx[sd]=m.stx[sd]||{}; if(ix==null) delete m.stx[sd][gi]; else m.stx[sd][gi]=ix; save(); openModal(pairsModal(id)); }
function setSplit(id,sd,si){ const m=tieById(id); if(!canScore()||tieStarted(m)) return; m['p'+sd]=SPLITS[si].map(x=>x.slice()); save(); openModal(pairsModal(id)); }
function swapOrder(id,sd){ const m=tieById(id); if(!canScore()||tieStarted(m)||!m['p'+sd]) return; m['p'+sd]=[m['p'+sd][1],m['p'+sd][0]]; save(); openModal(pairsModal(id)); }
function redrawTie(id){ const m=tieById(id); if(!canScore()||tieStarted(m)) return;
  ['a','b'].forEach(sd=>{ const tid=m[sd], cur=splitOf(m['p'+sd]), n=[0,0,0]; let prev=-1,next=-1,seen=false;
    S.ties.forEach(x=>{ if(x===m){ seen=true; return; } const s=splitOf(x.a===tid?x.pa:x.b===tid?x.pb:null); if(s<0) return;
      n[s]++; if(!seen) prev=s; else if(next<0) next=s; });
    m['p'+sd]=pairsFor(pickSplit(n,[[cur,prev,next],[cur,prev],[cur]],Math.random),Math.random); });
  save(); openModal(pairsModal(id)); toast('Re-drawn'); }

/* ---------- Rules ---------- */
function vRules(){ const r=S.rules, n=S.teams.length, R=roundsCount();
  return `<div class="card ed">
  <div class="rule-block"><h3>📋 Format</h3><ul>
    <li><b>${n} teams of ${SQUAD}</b> (a captain + ${SQUAD-1}). Every team plays every other team once: <b>${R} rounds, ${LEAGUE().length} ties</b>${n%2?' (one team rests each round)':''}, on ${S.courts.map(esc).join(', ')}.</li>
    <li>A <b>tie</b> is <b>two doubles games</b>. Each team splits into two pairs: one pair plays Game 1, the other Game 2.</li>
    <li><b>Pairs are drawn at random</b> for every tie and spread evenly: every player partners each teammate as equally as the number of ties allows, and never the same partner two ties running.</li></ul></div>
  <div class="rule-block"><h3>🏓 Each game</h3><ul><li>${esc(rulesPara())}</li></ul></div>
  <div class="rule-block"><h3>🧮 Points</h3><ul>
    <li><b>1 point per game won</b> + <b>1 bonus for a 2–0 sweep</b>: 2–0 = 3 pts · 1–1 = 1 pt each · 0–2 = 0.</li>
    <li>Level on points: point difference → head-to-head (two teams) → total points won.</li></ul></div>
  <div class="rule-block"><h3>🏆 Knockouts — top 4</h3><ul>
    <li><b>Semi-final 1</b>: 1st v 2nd — winner to the Final.</li>
    <li><b>Semi-final 2</b>: 3rd v 4th.</li>
    <li><b>Playoff</b>: loser of SF1 v winner of SF2 — winner to the Final.</li>
    <li><b>Final</b>: winner of SF1 v winner of the Playoff. The loser of the Playoff finishes third.</li>
    <li>A knockout tie that ends <b>1–1</b> goes to the team with more <b>total points</b> across both games; if still level, a <b>${esc(gRulesText(2))}</b> with one random pair from each team.</li></ul></div>
  <div class="rule-block"><h3>🙋 Missing players</h3><ul>
    <li><b>Replacement found</b>: he takes the missing player's place under his own name from the next game.</li>

function refCur(){ if(!S.ref) return null; const m=tieById(S.ref.id); if(!m) return null; return {m,gi:S.ref.gi,g:m.g[S.ref.gi]}; }

  else if(why) ban=`<div class="gamept">⚠ ${sa}–${sb}: ${esc(why)} (${esc(gRulesText(gi))})</div>`;
  else if(g.live&&isGoldenR(sa,sb,R)) ban=`<div class="gamept golden">⚡ <b>Golden point</b> — the next rally wins the game at ${R.G+1}–${R.G}.</div>`;
  else if(g.live){ const gp=gamePointR(sa,sb,R); if(gp) ban=`<div class="gamept">Game point · ${gp==='both'?'both pairs':esc((gp==='a'?A:B).name)}</div>`; }
  if(g.live&&endsNow&&!g.ends) ban+=`<div class="alert warn"><span>⇄</span><span style="flex:1"><b>Change ends</b> — ${S.rules.switchAt} reached. The screen has flipped to match.</span>${ro?'':'<button class="btn sm acc" onclick="refAck()">✓ Done</button>'}</div>`;
  const panel=(sd,i)=>{ const t=T_(sd), win=done&&((sd==='a')===(g.a>g.b));

    <div class="ttl">${esc(tieTitle(m))} · ${gName(gi)}<div class="sub2">${esc(courtName(gCourt(m,gi)))} · ${fmtTime(gSlot(m,gi))} · ${esc(gRulesText(gi))}${ro?' · watching live':''}</div></div></div>
    ${ban}

function refG(){ const c=refCur(); return (c&&canScore())?c:null; }
function refStart(){ const c=refG(); if(!c) return; if(gStarted(c.g)&&!confirm('Replace the typed score and count this game point by point?')) return;

function refAdd(sd){ const c=refG(); if(!c||!c.g.live) return; const g=c.g, R=gRules(c.gi);
  g.log.push(sd); g[sd]=(g[sd]||0)+1; if(gameOverR(g.a,g.b,R)) g.live=false; save(); renderRef();
  if(!g.live) toast(teamById(sd==='a'?c.m.a:c.m.b).name+' win the game'); }
function refMinus(sd){ const c=refG(); if(!c||!c.g.live) return; const g=c.g; if(!g[sd]) return;

function refUndo(){ const c=refG(); if(!c) return; const g=c.g; if(!g.log||!g.log.length) return; const sd=g.log.pop(); g[sd]=Math.max(0,(g[sd]||0)-1); g.live=true;

function refEndNow(){ const c=refG(); if(!c) return; const g=c.g; if(g.a===g.b) return toast('Level at '+g.a+'–'+g.b+' — play one more rally');

function refClear(){ const c=refG(); if(!c) return; if(!confirm('Reset this game to no score?')) return; c.m.g[c.gi]=newGame(); save(); renderRef(); }
function refAck(){ const c=refG(); if(!c) return; c.g.ends=true; save(); renderRef(); }
function refFlip(){ if(!S.ref) return; S.inv=S.inv||{}; const k=S.ref.id+':'+S.ref.gi; S.inv[k]=!S.inv[k]; quietSave(); renderRef(); }

function scoreInput(el){

  if(raw!==''&&+raw>cap){ raw=String(cap); toast('No score can go past '+cap+' ('+rulesShort()+')'); }

}
function scoreCheck(el){ const bits=el.dataset.k.split(':'), gi=+bits[1], m=tieById(bits[0]); if(!m) return; const g=m.g[gi], why=oddGame(g,gi);

  e.preventDefault(); const list=[...document.querySelectorAll('input.sc:not([disabled])')], t=list[list.indexOf(a)+1]; if(t){t.focus();t.select&&t.select();} else a.blur(); },true);

function pickLogo(kind,id,el){ const f=el.files&&el.files[0]; el.value=''; if(!f) return; if(!/^image\//.test(f.type)) return toast('That is not an image file');
  readLogo(f).then(url=>{ const o=findBrand(kind,id); if(!o) return; o.logo=url; o.invert=false; brandChanged('Logo added'); }).catch(e=>toast(String(e.message||e))); }
function readLogo(file){
  return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onerror=()=>rej(new Error('That file could not be read'));
    fr.onload=()=>{ const img=new Image(); img.onerror=()=>rej(new Error('That image could not be opened'));
      img.onload=()=>{ const draw=(mw,mh,type,q)=>{ const s=Math.min(1,mw/img.width,mh/img.height), cv=document.createElement('canvas');
          cv.width=Math.max(1,Math.round(img.width*s)); cv.height=Math.max(1,Math.round(img.height*s));
          const cx=cv.getContext('2d'); cx.imageSmoothingQuality='high'; if(type==='image/jpeg'){cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);}
          cx.drawImage(img,0,0,cv.width,cv.height); return cv.toDataURL(type,q); };
        let url=draw(440,180,'image/png'); if(url.length>LOGO_BUDGET) url=draw(300,120,'image/png');
        if(url.length>LOGO_BUDGET) url=draw(440,180,'image/jpeg',.86);
        if(url.length>LOGO_BUDGET) return rej(new Error('That image is too detailed to store — try a simpler logo'));
        res(url); };
      img.src=fr.result; };
    fr.readAsDataURL(file); });
}

async function downloadBranded(){

  try{ const res=await fetch(location.origin+location.pathname,{cache:'reload'}); if(!res.ok) throw new Error('HTTP '+res.status);
    let html=await res.text(); if(html.indexOf('<title>')<0) throw new Error('not the app file');
    html=html.replace(/<title>[\s\S]*?<\/title>/,'<title>'+q(t)+'</title>');
    const meta=(a,n,v)=>{ html=html.replace(new RegExp('(<meta '+a+'="'+n+'" content=")[^"]*(")'),'$1'+q(v)+'$2'); };
    meta('property','og:title',t); meta('name','twitter:title',t); meta('property','og:site_name',hostName()); meta('name','description','Live scores — '+t+' · '+hostName());
    const e1=v=>String(v).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    html=html.replace(/const EVENT_TITLE = '[^']*';/,"const EVENT_TITLE = '"+e1(S.meta.title)+"';");
    html=html.replace(/const EVENT_SUB   = '[^']*';/,"const EVENT_SUB   = '"+e1(S.meta.sub)+"';");
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([html],{type:'text/html'})); a.download='index.html'; a.click(); toast('Downloaded — upload this as index.html');

}

function bodyTeamFix(ctx,y,tid){

async function shareImage(key){
  if(!canShare()) return; toast('Drawing…');
  try{ if(document.fonts&&document.fonts.ready) await document.fonts.ready;
    const stv=/^st:/.test(key)?key.split(':'):null;
    if(stv){ const D=statsData(stv[1],stv[2]); const cv=await eventCanvas(D.title,(ctx,y)=>bodyStatsSeg(ctx,y,stv[1],stv[2]));
      const blob=await new Promise(res=>cv.toBlob(res,'image/png')); if(!blob) return toast('Could not make the image');
      const name='Hotshots-'+D.title.replace(/[^\w]+/g,'-')+'.png', file=new File([blob],name,{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file],title:S.meta.title+' · '+D.title}); return; }catch(e){ if(e&&e.name==='AbortError') return; } }
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); toast('Saved '+name); return; }
    const tf=/^tf:/.test(key)?teamById(key.slice(3)):null; if(/^tf:/.test(key)&&!tf) return toast('That team no longer exists');
    const label=tf?tf.name+' fixtures':key==='table'?'Standings':key==='ko'?'Knockouts':key==='stats'?'MVP':key==='teams'?'Teams':'Round '+key.slice(1);
    const body=tf?((ctx,y)=>bodyTeamFix(ctx,y,tf.id)):key==='table'?bodyStandings:key==='ko'?bodyKO:key==='stats'?bodyStats:key==='teams'?bodyTeams:(ctx,y)=>bodyRound(ctx,y,+key.slice(1));
    const cv=await eventCanvas(label,body);
    const blob=await new Promise(res=>cv.toBlob(res,'image/png')); if(!blob) return toast('Could not make the image');
    const name='Hotshots-'+label.replace(/[^\w]+/g,'-')+'.png', file=new File([blob],name,{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file],title:S.meta.title+' · '+label}); return; }catch(e){ if(e&&e.name==='AbortError') return; } }
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); toast('Saved '+name);
  }catch(e){ toast('Image failed: '+(e.message||e)); }
}

    <div class="card" style="font-size:11px;line-height:1.8;color:var(--muted);padding:10px 12px">${sync.log.length?sync.log.map(esc).join('<br>'):'Nothing yet.'}</div>
    <div class="row" style="margin:14px 0">${sync.on?'<button class="btn" onclick="syncStop();openModal(syncModal())">Turn sync off</button>':'<button class="btn acc" onclick="syncStart();openModal(syncModal())">Turn sync on</button>'}
      <button class="btn sm" onclick="syncPull(true)">Check now</button>${canScore()?'<button class="btn sm" onclick="syncPublishAll()">Re-send everything</button>':''}</div>
    <div class="alert ok"><span>⟳</span><span><b>This device is running ${BUILD}</b><br>If a phone behaves differently from the others it may be on an older copy.
      <div class="row" style="margin-top:8px"><button class="btn sm" onclick="location.replace(location.origin+location.pathname+'?v='+Date.now())">Get the latest version</button></div></span></div>
    <button class="btn acc" style="width:100%;margin-top:10px" onclick="closeModal()">Close</button>`;
}
function changeEvent(v){ v=(v||'').trim()||'hs19'; if(v===sync.event) return;
  sync.event=v; sync.cursor=null; sync.rev={}; sync.sent={}; sync.dirty={}; syncBaseline(); if(sync.on) syncStart(); toast('Event set to '+v); }

/* ===================== not losing the page by accident ===================== */
let backArmed=false,backTimer=null;
function guardHistory(){
  try{ history.pushState({hs:1},'',location.href); }catch(e){ return; }
  window.addEventListener('popstate',()=>{ const re=()=>{ try{history.pushState({hs:1},'',location.href);}catch(e){} };
    if(S.ref){ re(); refBack(); return; } if(modalOpen){ re(); closeModal(); return; }
    if(S.tab!==TABS()[0][0]){ re(); go(TABS()[0][0]); return; }
    if(canScore()&&!backArmed){ backArmed=true; re(); toast('Press back again to leave — every score is already saved');
      clearTimeout(backTimer); backTimer=setTimeout(()=>{backArmed=false;},2600); } });
}
window.addEventListener('beforeunload',e=>{ const q=Object.keys(sync.dirty||{}).length;
  if(canScore()&&(S.ref||q)){ e.preventDefault(); e.returnValue=''; return ''; } });
window.addEventListener('pagehide',quietSave);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') quietSave(); else if(sync.on) syncPull(false); });

/* ===================== start ===================== */
let S=load();
applyTheme(); syncLoad(); refresh(); guardHistory();
/* a phone that has never synced starts from what it has; any other phone
   first queues whatever changed here but never went out, before it listens */
if(!Object.keys(sync.sent).length&&!Object.keys(sync.dirty).length) syncBaseline(); else syncScan();
render();
if(sync.on){ syncStatus('sync'); pullTimer=setInterval(syncTick,PULL_MS); syncPull(true); }
else syncStatus('off');
</script>
</body>
</html>
